<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스마트 경보 시스템</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  header {
    background: #1e293b;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #334155;
  }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  #conn-badge {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    background: #ef4444;
    color: #fff;
    transition: background .3s;
  }
  #conn-badge.ok { background: #22c55e; }

  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 24px; }

  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
  }
  .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; margin-bottom: 14px; }

  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  button:hover { opacity: .85; }
  button:active { transform: scale(.96); }

  .btn-primary  { background: #3b82f6; color: #fff; }
  .btn-danger   { background: #ef4444; color: #fff; }
  .btn-green    { background: #22c55e; color: #fff; }
  .btn-yellow   { background: #eab308; color: #000; }
  .btn-purple   { background: #a855f7; color: #fff; }
  .btn-gray     { background: #475569; color: #fff; }

  /* 세그먼트 슬라이더 */
  .seg-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  input[type=range] { flex: 1; accent-color: #3b82f6; }
  #seg-val { font-size: 1.4rem; font-weight: 700; min-width: 24px; text-align: center; }

  /* 상태 조회 결과 */
  .status-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
  .status-item { background: #0f172a; border-radius: 8px; padding: 10px; text-align: center; }
  .status-item .label { font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; }
  .status-item .val { font-size: 1rem; font-weight: 700; }
  .val.on  { color: #22c55e; }
  .val.off { color: #ef4444; }

  /* 이벤트 로그 */
  #log-card { grid-column: 1 / -1; }
  #log {
    background: #0f172a;
    border-radius: 8px;
    padding: 12px;
    height: 180px;
    overflow-y: auto;
    font-size: 0.8rem;
    font-family: monospace;
    display: flex;
    flex-direction: column-reverse;
  }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #1e293b; }
  .log-entry.alarm  { color: #ef4444; font-weight: 600; }
  .log-entry.info   { color: #94a3b8; }
  .log-entry.count  { color: #3b82f6; }
  .log-entry.ok     { color: #22c55e; }
</style>
</head>
<body>

<header>
  <h1>스마트 경보 시스템</h1>
  <span id="conn-badge">● 연결 끊김</span>
</header>

<main>

  <!-- LED -->
  <div class="card">
    <h2>💡 LED</h2>
    <div class="btn-group">
      <button class="btn-green"  onclick="send('led_on')">ON</button>
      <button class="btn-danger" onclick="send('led_off')">OFF</button>
      <button class="btn-gray"   onclick="send('led_low')">밝기 낮음</button>
      <button class="btn-yellow" onclick="send('led_mid')">밝기 보통</button>
      <button class="btn-primary" onclick="send('led_high')">밝기 높음</button>
    </div>
  </div>

  <!-- 부저 -->
  <div class="card">
    <h2>🔔 부저</h2>
    <div class="btn-group">
      <button class="btn-green"  onclick="send('buzzer_on')">ON</button>
      <button class="btn-danger" onclick="send('buzzer_off')">OFF</button>
      <button class="btn-purple" onclick="send('buzzer_melody')">🎵 멜로디</button>
    </div>
  </div>

  <!-- 세그먼트 카운트다운 -->
  <div class="card">
    <h2>⏱ 세그먼트 카운트다운</h2>
    <div class="seg-row">
      <input type="range" id="seg-slider" min="1" max="9" value="5"
             oninput="document.getElementById('seg-val').textContent=this.value">
      <span id="seg-val">5</span>
    </div>
    <div class="btn-group" style="margin-top:12px">
      <button class="btn-primary" onclick="send('segment', {value: +document.getElementById('seg-slider').value})">카운트다운 시작</button>
    </div>
  </div>

  <!-- 상태 조회 -->
  <div class="card">
    <h2>📊 상태 조회</h2>
    <div class="status-grid">
      <div class="status-item">
        <div class="label">LED</div>
        <div class="val" id="st-led">—</div>
      </div>
      <div class="status-item">
        <div class="label">부저</div>
        <div class="val" id="st-buzzer">—</div>
      </div>
      <div class="status-item">
        <div class="label">센서</div>
        <div class="val" id="st-sensor">—</div>
      </div>
    </div>
    <div class="btn-group" style="margin-top:12px">
      <button class="btn-gray" onclick="send('query_led');send('query_buzzer');send('query_sensor')">새로고침</button>
    </div>
  </div>

  <!-- 이벤트 로그 -->
  <div class="card" id="log-card">
    <h2>📋 이벤트 로그</h2>
    <div id="log"></div>
  </div>

</main>

<script>
const badge = document.getElementById('conn-badge');
const logEl  = document.getElementById('log');

let ws;

function connect() {
  ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => addLog('서버 WebSocket 연결됨', 'ok');

  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);

    if (msg.type === 'status') {
      badge.textContent = msg.connected ? '● 연결됨' : '● 연결 끊김';
      badge.className   = msg.connected ? 'ok' : '';
      addLog(msg.connected ? '라즈베리파이 연결됨' : '라즈베리파이 연결 끊김', msg.connected ? 'ok' : 'alarm');
    }

    else if (msg.type === 'event') {
      const cls = (msg.action === 0x01 || msg.action === 0x02 || msg.action === 0x04) ? 'alarm'
                : (msg.action === 0x03) ? 'count' : 'info';
      addLog('[이벤트] ' + msg.label, cls);
    }

    else if (msg.type === 'resp') {
      const devMap = { 1:'LED', 2:'부저', 3:'센서', 4:'세그먼트', 0:'시스템' };
      const dev = devMap[msg.device] || '?';

      if (msg.action === 0x05) {
        /* ACT_GET_STATUS 응답 */
        const idMap = { 1:'st-led', 2:'st-buzzer', 3:'st-sensor' };
        const el = document.getElementById(idMap[msg.device]);
        if (el) {
          const isOn = msg.value === 1;
          el.textContent = msg.device === 3 ? (isOn ? '차단' : '정상') : (isOn ? 'ON' : 'OFF');
          el.className   = 'val ' + (isOn ? 'on' : 'off');
        }
      } else {
        const res = msg.value === 0 ? 'OK' : msg.value === 2 ? 'BUSY' : 'ERR';
        addLog(`[응답] ${dev} → ${res}`, msg.value === 0 ? 'ok' : 'alarm');
      }
    }
  };

  ws.onclose = () => {
    badge.textContent = '● 연결 끊김';
    badge.className = '';
    addLog('WebSocket 끊김 — 재연결 중...', 'alarm');
    setTimeout(connect, 2000);
  };
}

function send(cmd, extra = {}) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ cmd, ...extra }));
}

function addLog(text, cls = 'info') {
  const d = document.createElement('div');
  d.className = `log-entry ${cls}`;
  const now = new Date().toLocaleTimeString('ko-KR');
  d.textContent = `[${now}] ${text}`;
  logEl.prepend(d);
  if (logEl.children.length > 100) logEl.lastChild.remove();
}

connect();
</script>
</body>
</html>
